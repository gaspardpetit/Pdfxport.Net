name: Publish NuGet packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Determine package version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Release tag must be a version such as v0.1.0 or v0.1.0-preview.1"
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
      - name: Download build assets
        shell: pwsh
        run: ./dev/download-assets.ps1
      - name: Run core tests
        shell: pwsh
        run: |
          dotnet test src/foundation/src/PDFsharp/tests/PdfSharp.Tests/PdfSharp.Tests.csproj -f net8.0 --configuration Release --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw "PDFsharp tests failed" }
          dotnet test src/foundation/src/MigraDoc/tests/MigraDoc.Tests/MigraDoc.Tests.csproj -f net8.0 --configuration Release --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw "MigraDoc tests failed" }
      - name: Build packages
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $projects = @(
            'src/foundation/nuget/src/Pdfxport.Net.NuGet/Pdfxport.Net.NuGet.csproj',
            'src/foundation/nuget/src/Pdfxport.Net.MigraDoc.NuGet/Pdfxport.Net.MigraDoc.NuGet.csproj'
          )
          foreach ($project in $projects) {
            dotnet build $project --configuration Release "-p:Version=$env:PACKAGE_VERSION" "-p:PackageVersion=$env:PACKAGE_VERSION" --verbosity quiet
            if ($LASTEXITCODE -ne 0) { throw "Package build failed: $project" }
          }
          New-Item -ItemType Directory -Force artifacts/packages | Out-Null
          $packages = @(
            "src/foundation/nuget/src/Pdfxport.Net.NuGet/bin/Release/Pdfxport.Net.$env:PACKAGE_VERSION.nupkg",
            "src/foundation/nuget/src/Pdfxport.Net.MigraDoc.NuGet/bin/Release/Pdfxport.Net.MigraDoc.$env:PACKAGE_VERSION.nupkg"
          )
          foreach ($package in $packages) {
            if (-not (Test-Path -LiteralPath $package)) { throw "Missing package: $package" }
            Copy-Item -LiteralPath $package -Destination artifacts/packages
          }
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: pdfxport-nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Authenticate to NuGet with Trusted Publishing
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: gaspardpetit
      - name: Publish packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem artifacts/packages -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "NuGet push failed: $($_.Name)" }
          }
